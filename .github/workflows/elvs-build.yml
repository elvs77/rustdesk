# elvs Fernwartung: custom RustDesk client build (Windows x64 + macOS x86_64/arm64).
#
# Reduced copy of the Windows-x64 and macOS jobs from flutter-build.yml. No signing.
#
# - Push to branch "elvs": build only, installers are uploaded as workflow artifacts.
# - Run workflow manually with "release" = true, or push a tag "elvs-<version>-<n>":
#   after a successful build a GitHub release "elvs-<version>-<n>" is published in this
#   repository with fixed asset names and the update metadata (rustdesk-update.json).
#   Clients 1.5.1-1/-2 still read rustdesk-update.json of the latest release and update
#   themselves (see ELVS_UPDATE_REPO in src/common.rs). From 1.5.1-3 on, updates are
#   disabled in the client (elvs_updates_disabled) until the metadata is signed with an
#   own key; those clients are updated manually with the MSI/DMG from the release page.
name: elvs build

on:
  push:
    branches:
      - elvs
    tags:
      - "elvs-*"
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a GitHub release (update for all installed clients)"
        type: boolean
        default: false

concurrency:
  group: elvs-build-${{ github.ref }}-${{ (inputs.release || startsWith(github.ref, 'refs/tags/')) && 'release' || 'build' }}
  cancel-in-progress: ${{ !(inputs.release || startsWith(github.ref, 'refs/tags/')) }}

permissions:
  contents: read

env:
  # Server defaults compiled into the client (public values, read via option_env! in src/common.rs).
  RENDEZVOUS_SERVER: "support.elvs.it"
  RELAY_SERVER: "support.elvs.it:21117"
  API_SERVER: "https://support.elvs.it"
  RS_PUB_KEY: "6hSa0cQbMIhdBeHkGski5D5sB78JE1gD+PlwHrKxi54="
  # Own update channel: clients only trust releases "elvs-<version>-<n>" of this repository.
  ELVS_UPDATE_REPO: ${{ github.repository }}

  # Toolchain versions, kept in sync with flutter-build.yml.
  RUST_VERSION: "1.75"
  SCITER_RUST_VERSION: "1.75"
  MAC_RUST_VERSION: "1.81"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  FLUTTER_MACOS_ARM_VERSION: "3.44.9"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"

jobs:
  # Determines version (from Cargo.toml), build number and release tag.
  # Build number: from the tag "elvs-<version>-<n>", or for a manual release run the
  # highest existing n for this version + 1. Builds without release use 0.
  prepare:
    name: prepare
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      build: ${{ steps.v.outputs.build }}
      tag: ${{ steps.v.outputs.tag }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Determine version, build number and tag
        id: v
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_RELEASE: ${{ inputs.release }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version *= *"\([0-9.]*\)".*/\1/p' Cargo.toml | head -n 1)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Cannot read version from Cargo.toml"; exit 1
          fi
          release=false; build=0; tag=""
          if [[ "$GITHUB_REF" == refs/tags/elvs-* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
            if [[ ! "$tag" =~ ^elvs-([0-9]+\.[0-9]+\.[0-9]+)-([0-9]+)$ ]]; then
              echo "::error::Tag must look like elvs-$version-<n>, got $tag"; exit 1
            fi
            if [[ "${BASH_REMATCH[1]}" != "$version" ]]; then
              echo "::error::Tag version ${BASH_REMATCH[1]} != Cargo.toml version $version"; exit 1
            fi
            build=$((10#${BASH_REMATCH[2]}))
            if [[ "$build" -lt 1 ]]; then
              echo "::error::Build number must be >= 1"; exit 1
            fi
            release=true
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && "$INPUT_RELEASE" == "true" ]]; then
            existing=$( {
              gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name' || true
              gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/elvs-$version-" --jq '.[].ref' || true
            } | sed 's#^refs/tags/##' | grep -E "^elvs-${version//./\\.}-[0-9]+$" | sed 's/.*-//' | sort -n | tail -n 1 || true)
            build=$(( ${existing:-0} + 1 ))
            tag="elvs-$version-$build"
            release=true
          fi
          echo "version=$version build=$build tag=$tag release=$release"
          {
            echo "version=$version"
            echo "build=$build"
            echo "tag=$tag"
            echo "release=$release"
          } >> "$GITHUB_OUTPUT"

  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  build-RustDeskTempTopMostWindow:
    uses: ./.github/workflows/third-party-RustDeskTempTopMostWindow.yml
    with:
      upload-artifact: true
      target: windows-2022
      configuration: Release
      platform: x64
      target_version: Windows10

  build-for-windows-flutter:
    name: windows x86_64
    needs: [prepare, build-RustDeskTempTopMostWindow, generate-bridge]
    runs-on: windows-2022
    env:
      ELVS_BUILD: ${{ needs.prepare.outputs.build }}
      ELVS_TARGET: x86_64-pc-windows-msvc
      ELVS_ARCH: x86_64
      ELVS_VCPKG_TRIPLET: x64-windows-static
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install flutter
        uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225  # v2.12.0
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      # https://github.com/flutter/flutter/issues/155685
      - name: Replace engine with rustdesk custom flutter engine
        run: |
          flutter doctor -v
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          mv -Force windows-x64-release/*  C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/

      - name: Patch flutter
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
          cd $(dirname $(dirname $(which flutter)))
          if [[ "3.24.5" == ${{env.FLUTTER_VERSION}} ]]; then
            git apply flutter_3.24.4_dropdown_menu_enableFilter.diff
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.SCITER_RUST_VERSION }}
          targets: ${{ env.ELVS_TARGET }}
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: elvs-windows-2022

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: ${{ env.ELVS_VCPKG_TRIPLET }}
        run: |
          if ! $VCPKG_ROOT/vcpkg \
            install \
            --triplet ${{ env.ELVS_VCPKG_TRIPLET }} \
            --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
              echo ""
            done
            exit 1
          fi
          head -n 100 "${VCPKG_ROOT}/buildtrees/ffmpeg/build-${{ env.ELVS_VCPKG_TRIPLET }}-rel-out.log" || true
        shell: bash

      - name: Build rustdesk
        run: |
          python3 .\build.py --portable --flutter --skip-portable-pack --hwcodec --vram
          mv ./flutter/build/windows/x64/runner/Release ./rustdesk

          # Download usbmmidd_v2.zip and extract it to ./rustdesk
          Invoke-WebRequest -Uri https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip -OutFile usbmmidd_v2.zip
          Expand-Archive usbmmidd_v2.zip -DestinationPath .
          Remove-Item -Path usbmmidd_v2\Win32 -Recurse
          Remove-Item -Path "usbmmidd_v2\deviceinstaller64.exe", "usbmmidd_v2\deviceinstaller.exe", "usbmmidd_v2\usbmmidd.bat"
          mv -Force .\usbmmidd_v2 ./rustdesk

          # Download printer driver files and extract them to ./rustdesk
          try {
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/rustdesk_printer_driver_v4-1.4.zip -OutFile rustdesk_printer_driver_v4-1.4.zip
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/printer_driver_adapter.zip -OutFile printer_driver_adapter.zip
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/sha256sums -OutFile sha256sums

            $checksum_driver = (Select-String -Path .\sha256sums -Pattern '^([a-fA-F0-9]{64}) \*rustdesk_printer_driver_v4-1.4\.zip$').Matches.Groups[1].Value
            $downloadsum_driver = Get-FileHash -Path rustdesk_printer_driver_v4-1.4.zip -Algorithm SHA256
            $checksum_adapter = (Select-String -Path .\sha256sums -Pattern '^([a-fA-F0-9]{64}) \*printer_driver_adapter\.zip$').Matches.Groups[1].Value
            $downloadsum_adapter = Get-FileHash -Path printer_driver_adapter.zip -Algorithm SHA256
            if ($checksum_driver -eq $downloadsum_driver.Hash -and $checksum_adapter -eq $downloadsum_adapter.Hash) {
                Write-Output "rustdesk_printer_driver_v4-1.4, checksums match, extract the file."
                Expand-Archive rustdesk_printer_driver_v4-1.4.zip -DestinationPath .
                mkdir ./rustdesk/drivers
                mv -Force .\rustdesk_printer_driver_v4-1.4 ./rustdesk/drivers/RustDeskPrinterDriver
                Expand-Archive printer_driver_adapter.zip -DestinationPath .
                mv -Force .\printer_driver_adapter.dll ./rustdesk
            } elseif ($checksum_driver -ne $downloadsum_driver.Hash) {
                Write-Output "rustdesk_printer_driver_v4-1.4, checksums do not match, ignore the file."
            } else {
                Write-Output "printer_driver_adapter.dll, checksums do not match, ignore the file."
            }
          } catch {
              Write-Host "Ingore the printer driver error."
          }

      - name: find Runner.res
        # Runner.rc does not contain actual version, but Runner.res does
        continue-on-error: true
        shell: bash
        run: |
          runner_res=$(find . -name "Runner.res");
          if [ "$runner_res" == "" ]; then
            echo "Runner.res: not found";
          else
            echo "Runner.res: $runner_res";
            cp $runner_res ./libs/portable/Runner.res;
            ls -l ./libs/portable/Runner.res;
          fi

      - name: Download RustDeskTempTopMostWindow artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: topmostwindow-artifacts-x64
          path: "./rustdesk"

      - name: Build self-extracted executable
        shell: bash
        run: |
          sed -i '/dpiAware/d' res/manifest.xml
          pushd ./libs/portable
          pip3 install -r requirements.txt
          python3 ./generate.py -f ../../rustdesk/ -o . -e ../../rustdesk/rustdesk.exe
          popd
          mkdir -p ./SignOutput
          mv ./target/release/rustdesk-portable-packer.exe ./SignOutput/elvs-fernwartung-${{ env.ELVS_ARCH }}.exe

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2

      - name: Build msi
        run: |
          pushd ./res/msi
          python preprocess.py --arp -d ../../rustdesk
          nuget restore msi.sln
          msbuild msi.sln -p:Configuration=Release -p:Platform=x64 /p:TargetVersion=Windows10
          $msi = Get-ChildItem ./Package/bin/*/Release/*/Package.msi | Select-Object -First 1
          mv $msi.FullName ../../SignOutput/elvs-fernwartung-${{ env.ELVS_ARCH }}.msi
          sha256sum ../../SignOutput/elvs-fernwartung-*

      - name: Upload Windows installers
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: elvs-fernwartung-windows-x86_64
          path: |
            ./SignOutput/elvs-fernwartung-*.exe
            ./SignOutput/elvs-fernwartung-*.msi
          if-no-files-found: error

  build-for-macOS:
    name: macos ${{ matrix.job.arch }}
    runs-on: ${{ matrix.job.os }}
    needs: [prepare, generate-bridge]
    env:
      ELVS_BUILD: ${{ needs.prepare.outputs.build }}
    strategy:
      fail-fast: false
      matrix:
        job:
          - {
              target: x86_64-apple-darwin,
              os: macos-15-intel,
              extra-build-args: "",
              arch: x86_64,
              vcpkg-triplet: x64-osx,
            }
          - {
              target: aarch64-apple-darwin,
              os: macos-15,
              extra-build-args: "--screencapturekit",
              arch: aarch64,
              vcpkg-triplet: arm64-osx,
            }
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Install build runtime
        run: |
          brew install llvm create-dmg
          if command -v pkg-config &>/dev/null; then
              echo "pkg-config is already installed"
          else
              brew install pkg-config
          fi

      - name: Install NASM
        run: |
          # NASM 2.16.x, not brew's NASM 3.x (incompatible with aom etc.)
          wget https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/macosx/nasm-2.16.03-macosx.zip
          unzip nasm-2.16.03-macosx.zip
          sudo cp nasm-2.16.03/nasm /usr/local/bin/nasm
          nasm --version

      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ matrix.job.arch == 'aarch64' && env.FLUTTER_MACOS_ARM_VERSION || env.FLUTTER_VERSION }}

      - name: Keep CocoaPods for Flutter 3.44 (arm64)
        if: ${{ matrix.job.arch == 'aarch64' }}
        run: flutter config --no-enable-swift-package-manager

      - name: Patch flutter
        if: ${{ matrix.job.arch == 'x86_64' }}
        run: |
          cd $(dirname $(dirname $(which flutter)))
          if [[ "3.24.5" == ${{env.FLUTTER_VERSION}} ]]; then
            git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff
          fi

      - name: Workaround for flutter issue
        shell: bash
        run: |
          cd "$(dirname "$(which flutter)")"
          # https://github.com/flutter/flutter/issues/133533
          sed -i -e 's/_setFramesEnabledState(false);/\/\/_setFramesEnabledState(false);/g' ../packages/flutter/lib/src/scheduler/binding.dart
          grep -n '_setFramesEnabledState(false);' ../packages/flutter/lib/src/scheduler/binding.dart

      - name: Patch RustDesk sources for Flutter 3.44 (arm64)
        if: ${{ matrix.job.arch == 'aarch64' }}
        shell: bash
        run: |
          brew install gnu-sed
          export PATH="$(brew --prefix gnu-sed)/libexec/gnubin:$PATH"
          bash .github/patches/apply_flutter_3.44_source_patches.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.MAC_RUST_VERSION }}
          targets: ${{ matrix.job.target }}
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: elvs-${{ matrix.job.os }}

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.job.arch == 'aarch64' && 'bridge-artifact-flutter-3.44' || 'bridge-artifact' }}
          path: ./

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        run: |
          if ! $VCPKG_ROOT/vcpkg \
            install \
            --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
              echo ""
            done
            exit 1
          fi
          head -n 100 "${VCPKG_ROOT}/buildtrees/ffmpeg/build-${{ matrix.job.vcpkg-triplet }}-rel-out.log" || true

      - name: Build rustdesk
        run: |
          if [ "${{ matrix.job.target }}" = "aarch64-apple-darwin" ]; then
            MIN_MACOS_VERSION="12.3"
            sed -i -e "s/MACOSX_DEPLOYMENT_TARGET\=[0-9]*.[0-9]*/MACOSX_DEPLOYMENT_TARGET=${MIN_MACOS_VERSION}/" build.py
            sed -i -e "s/platform :osx, '.*'/platform :osx, '${MIN_MACOS_VERSION}'/" flutter/macos/Podfile
            sed -i -e "s/osx_minimum_system_version = \"[0-9]*.[0-9]*\"/osx_minimum_system_version = \"${MIN_MACOS_VERSION}\"/" Cargo.toml
            sed -i -e "s/MACOSX_DEPLOYMENT_TARGET = [0-9]*.[0-9]*;/MACOSX_DEPLOYMENT_TARGET = ${MIN_MACOS_VERSION};/" flutter/macos/Runner.xcodeproj/project.pbxproj
            echo "MACOSX_DEPLOYMENT_TARGET=${MIN_MACOS_VERSION}" >> "$GITHUB_ENV"
          fi
          ./build.py --flutter --hwcodec --unix-file-copy-paste ${{ matrix.job.extra-build-args }}

      - name: Create unsigned dmg
        run: |
          CREATE_DMG="$(command -v create-dmg)"
          CREATE_DMG="$(readlink -f "$CREATE_DMG")"
          sed -i -e 's/MAXIMUM_UNMOUNTING_ATTEMPTS=3/MAXIMUM_UNMOUNTING_ATTEMPTS=7/' "$CREATE_DMG"
          create-dmg --volname "elvs Fernwartung" --icon "RustDesk.app" 200 190 --hide-extension "RustDesk.app" --window-size 800 400 --app-drop-link 600 185 elvs-fernwartung-${{ matrix.job.arch }}.dmg ./flutter/build/macos/Build/Products/Release/RustDesk.app

      - name: Upload macOS dmg
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: elvs-fernwartung-macos-${{ matrix.job.arch }}
          path: elvs-fernwartung-${{ matrix.job.arch }}.dmg
          if-no-files-found: error

  # Publishes the release that installed clients update from (fixed asset names,
  # update metadata rustdesk-update.json with sha256 and size of every installer).
  release:
    name: publish release
    # Windows is required; a missing macOS runner (cancelled job) must not hold back the Windows release.
    if: ${{ always() && needs.prepare.outputs.release == 'true' && needs.build-for-windows-flutter.result == 'success' }}
    needs: [prepare, build-for-windows-flutter, build-for-macOS]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.prepare.outputs.tag }}
      APP_VERSION: ${{ needs.prepare.outputs.version }}
      APP_BUILD: ${{ needs.prepare.outputs.build }}
    steps:
      - name: Download installers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: elvs-fernwartung-*
          merge-multiple: true
          path: dist

      - name: Write update metadata
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          ls -l
          python3 - <<'PY'
          import datetime, hashlib, json, os
          repo = os.environ["GITHUB_REPOSITORY"]
          tag = os.environ["TAG"]
          prefix = f"https://github.com/{repo}/releases/download/{tag}/"
          files = [
              ("windows", "x86_64", "exe", "elvs-fernwartung-x86_64.exe"),
              ("windows", "x86_64", "msi", "elvs-fernwartung-x86_64.msi"),
              ("macos", "x86_64", "dmg", "elvs-fernwartung-x86_64.dmg"),
              ("macos", "aarch64", "dmg", "elvs-fernwartung-aarch64.dmg"),
          ]
          artifacts = []
          for platform, arch, fmt, name in files:
              if not os.path.exists(name) and platform == "macos":
                  print("fehlt (macOS-Build nicht fertig):", name)
                  continue
              with open(name, "rb") as f:
                  data = f.read()
              artifacts.append({
                  "platform": platform, "arch": arch, "format": fmt,
                  "url": prefix + name, "file_name": name,
                  "size": len(data), "sha256": hashlib.sha256(data).hexdigest(),
              })
          metadata = {
              "schema_version": 1,
              "app": "rustdesk",
              "package_id": "rustdesk",
              "version": os.environ["APP_VERSION"],
              "release_id": tag,
              "published_at": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "signature_key_id": "elvs-unsigned",
              "elvs_build": int(os.environ["APP_BUILD"]),
              "artifacts": artifacts,
          }
          with open("rustdesk-update.json", "w") as f:
              json.dump(metadata, f, indent=2)
          PY
          cat rustdesk-update.json
          sha256sum elvs-fernwartung-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create release
        shell: bash
        run: |
          set -euo pipefail
          cat > notes.md <<EOF
          elvs Fernwartung $APP_VERSION, Build $APP_BUILD (Commit $GITHUB_SHA).

          Neu in Build 10: Der Hinweis auf eine neue Version lädt unter Windows direkt die MSI herunter
          (statt die GitHub-Seite mit allen Dateien zu öffnen). Im Setup steht über den englischen
          Bestimmungen ein deutscher Hinweis.

          Build 9: Das Setup (MSI-Installer) ist jetzt auf Deutsch - alle Knöpfe und Texte
          der Installation, damit Kunden ohne Englisch sicher durchklicken können. Sonst wie Build 8.

          Build 8: Der Kunde sieht wieder Ihre Maus. Ohne Haken verbinden Sie sich immer
          mit der Sitzung, in der der Kunde angemeldet ist (keine Abfrage "Konsole oder RDP").
          Neuer Haken "Unauffällig verbinden" neben "Verbinden": dann wählen Sie die Windows-Sitzung
          selbst, z. B. eine eigene RDP-Sitzung. Außerdem zeigt der Client beim Start an, wenn es
          eine neue elvs-Version gibt (Knopf öffnet die Release-Seite, installiert wird nichts von
          selbst). Die Sprache richtet sich nach Windows und ist unter Einstellungen > Allgemein
          wählbar. Wirkt auf beiden Seiten: Build 8 auf dem Kunden-PC und auf Ihrem PC.

          Build 7: Die automatische Ausweichverbindung über Port 443 (WebSocket) ist wieder
          an. support.elvs.it nimmt seit 09.11.2026 die Anmeldung eines Rechners auch über
          TCP/WebSocket an (eigener hbbs, Branch elvs-hbbs; getestet mit gesperrten Ports 21115-21119).
          Kommt ein Rechner 90 s nicht über 21116 durch, schaltet er selbst auf 443 um. Zurück auf
          den normalen Weg geht er erst, wenn der Server wieder über UDP 21116 antwortet (stündlich
          geprüft) - eine Firewall, die nur UDP sperrt, führt so nicht mehr zu stündlichen Aussetzern.
          Seit Build 7 ist der Datenschutzmodus (schwarzer Bildschirm beim Kunden) dauerhaft aus.

          Seit Build 4: Der Client schickt kein Anmelde-Token mehr an den Server (behebt "Failed to
          secure tcp: deadline has elapsed" nach einer Anmeldung im Client).

          Das automatische Update ist seit Build 3 abgeschaltet (bis Updates mit einem eigenen
          Schlüssel signiert sind). Aktualisieren: passende Datei unten herunterladen und
          ausführen (Windows: MSI als Administrator installieren, macOS: DMG öffnen und die App
          in "Programme" ersetzen). Ältere Clients 1.5.1-1/-2 holen sich dieses Update noch
          einmal selbst; danach ist auch bei ihnen das automatische Update aus.

          | Datei | System |
          |---|---|
          | elvs-fernwartung-x86_64.msi | Windows 64-bit (MSI-Installer) |
          | elvs-fernwartung-x86_64.exe | Windows 64-bit (Programm / Installer) |
          | elvs-fernwartung-aarch64.dmg | macOS Apple Silicon (M1 und neuer) |
          | elvs-fernwartung-x86_64.dmg | macOS Intel |
          EOF
          # Create as draft first, so "latest" never points to a release without assets.
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --draft --title "elvs Fernwartung $APP_VERSION (Build $APP_BUILD)" --notes-file notes.md \
            dist/elvs-fernwartung-*.msi dist/elvs-fernwartung-*.exe dist/elvs-fernwartung-*.dmg \
            dist/rustdesk-update.json dist/SHA256SUMS.txt
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url,assets --jq '.url, (.assets[].name)'

